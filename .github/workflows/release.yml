name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run CI for release pull request
        if: ${{ steps.release.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].headBranchName' <<< "$RELEASE_PRS" | while read -r branch; do
            gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
